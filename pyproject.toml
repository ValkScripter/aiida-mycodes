[build-system]
# build the package with [flit](https://flit.readthedocs.io)
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[project]
# See https://www.python.org/dev/peps/pep-0621/
name = "aiida-mycodes"
dynamic = ["version"]  # read from aiida_mycodes/__init__.py
description = "My AiiDA test plugin to study my own structures"
authors = [{name = "Valk Scripter", email = "valkscode@gmail.com"}]
readme = "README.md"
license = {file = "LICENSE"}
classifiers = [
    "Programming Language :: Python",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Development Status :: 3 - Alpha",
    "Framework :: AiiDA"
]
keywords = ["aiida", "plugin"]
requires-python = ">=3.7"
dependencies = [
    "aiida-core>=2.5,<3",
    "aiida-quantumespresso",
    "aiida-wannier90-workflows",
    "pymc",
    "voluptuous"
]

[project.urls]
Source = "https://github.com/ValkScripter/aiida-mycodes"

[project.optional-dependencies]
testing = [
    "pgtest~=1.3.1",
    "wheel~=0.31",
    "coverage[toml]",
    "pytest~=6.0",
    "pytest-cov"
]
pre-commit = [
    "pre-commit~=2.2",
    "pylint~=2.15.10"
]
docs = [
    "sphinx",
    "sphinxcontrib-contentui",
    "sphinxcontrib-details-directive",
    "furo",
    "markupsafe<2.1"
]

[project.scripts]
aiida-mycodes = "aiida_mycodes.cli:cmd_root"

[project.entry-points."aiida.workflows"]
"mycodes.charge_density" = "aiida_mycodes.workflows.charge_density:ChargeDensityWorkChain"
"mycodes.projwfcbands_interpolation" = "aiida_mycodes.workflows.projwfcbands_interpolation:ProjwfcBandsInterpolationWorkChain"
"mycodes.scf_interpolation" = "aiida_mycodes.workflows.scf_interpolation:ScfInterpolationWorkChain"
"mycodes.xdos" = "aiida_mycodes.workflows.xdos:XdosWorkChain"
"mycodes.projwfcbands" = "aiida_mycodes.workflows.projwfcbands:MyProjwfcBandsWorkChain"
"mycodes.full_study" = "aiida_mycodes.workflows.full_study:FullStudyWorkChain"
"mycodes.birch_murnaghan_relax" = "aiida_mycodes.workflows.birch_murnaghan_relax:BirchMurnaghanRelaxWorkChain"
"mycodes.fireball_birch_murnaghan_relax" = "aiida_mycodes.workflows.fireball_birch_murnaghan_relax:FireballBirchMurnaghanRelaxWorkChain"
"mycodes.electrostatic_potential" = "aiida_mycodes.workflows.electrostatic_potential:ElectrostaticPotentialWorkChain"
"mycodes.work_function" = "aiida_mycodes.workflows.work_function:WorkFunctionWorkChain"
"mycodes.phonon" = "aiida_mycodes.workflows.phonon:PhononWorkChain"

[project.entry-points."aiida.calculations"]
"mycodes.structure.interpolate" = "aiida_mycodes.calculations.structure.tools:interpolate_structures"
"mycodes.structure.scale" = "aiida_mycodes.calculations.structure.tools:scale_structure"
"mycodes.structure.superposition" = "aiida_mycodes.calculations.structure.tools:superposition"
"mycodes.birch_murnaghan_fit" = "aiida_mycodes.calculations.birch_murnaghan_fit:birch_murnaghan_fit"
"mycodes.birch_murnaghan_fit_bayesian" = "aiida_mycodes.calculations.birch_murnaghan_fit:birch_murnaghan_fit_bayesian"

[tool.flit.module]
name = "aiida_mycodes"

[tool.flit.sdist]
exclude = [
    'docs/',
    'tests/',
]

[tool.pylint.format]
max-line-length = 125

[tool.pylint.messages_control]
disable = [
    "too-many-ancestors",
    "invalid-name",
    "duplicate-code",
    "too-many-locals",
    "too-many-positional-arguments",
]

[tool.pytest.ini_options]
# Configuration for [pytest](https://docs.pytest.org)
testpaths = [
    'tests',
]
filterwarnings = [
    'ignore:Object of type .* not in session, .* operation along .* will not proceed:sqlalchemy.exc.SAWarning',
    'ignore:Creating AiiDA configuration folder.*:UserWarning',
    'ignore::DeprecationWarning:frozendict:',
    'ignore::DeprecationWarning:pkg_resources:',
    'ignore::DeprecationWarning:sqlalchemy_utils:',
    'ignore::DeprecationWarning:aiida:',
    'ignore:Creating AiiDA configuration folder:',
    'ignore::DeprecationWarning:plumpy:',
    'ignore::DeprecationWarning:yaml:',
]

[tool.coverage.run]
# Configuration of [coverage.py](https://coverage.readthedocs.io)
# reporting which lines of your plugin are covered by tests
source=["aiida_mycodes"]

[tool.isort]
# Configuration of [isort](https://isort.readthedocs.io)
line_length = 120
force_sort_within_sections = true
sections = ['FUTURE', 'STDLIB', 'THIRDPARTY', 'AIIDA', 'FIRSTPARTY', 'LOCALFOLDER']
known_aiida = ['aiida']

[tool.tox]
legacy_tox_ini = """
[tox]
envlist = py38

[testenv]
description = Run the pytest tests
usedevelop=True
extras = tests
commands = pytest {posargs}

[testenv:py{37,38,39,310}]
description = Run the test suite against a python version
extras = testing
commands = pytest {posargs}

[testenv:pre-commit]
description = Run the pre-commit checks
extras =
    tests
    pre-commit
commands = pre-commit run {posargs}

[testenv:docs]
description = Build the documentation
extras = docs
commands = sphinx-build -nW --keep-going -b html {posargs} docs/source docs/build/html
commands_post = echo "open file://{toxinidir}/docs/build/html/index.html"
"""
